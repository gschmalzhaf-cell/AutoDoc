<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#DCE9FA"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#2D66C8"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7EFF"/>
      <stop offset="100%" stop-color="#5B9BFF"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="1024" height="1024" rx="240" ry="240"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Subtle cozy border -->
    <rect width="1024" height="1024" rx="240" ry="240" fill="none" stroke="rgba(45,102,200,0.14)" stroke-width="6"/>

    <!-- Playful sparkle accent -->
    <path d="M780 180 C785 225, 800 240, 845 245 C800 250, 785 265, 780 310 C775 265, 760 250, 715 245 C760 240, 775 225, 780 180 Z" fill="url(#sparkle)" opacity="0.9"/>

    <!-- Waveform bars - 7 cozy rounded bars centered -->
    <g transform="translate(512, 520)">
      <rect x="-204" y="-85" width="32" height="170" rx="16" fill="url(#bar)" opacity="0.82"/>
      <rect x="-136" y="-165" width="32" height="330" rx="16" fill="url(#bar)" opacity="0.9"/>
      <rect x="-68" y="-245" width="32" height="490" rx="16" fill="url(#bar)"/>
      <rect x="-16" y="-145" width="32" height="290" rx="16" fill="url(#bar)" opacity="0.92"/>
      <rect x="52" y="-215" width="32" height="430" rx="16" fill="url(#bar)" opacity="0.95"/>
      <rect x="120" y="-115" width="32" height="230" rx="16" fill="url(#bar)" opacity="0.85"/>
      <rect x="188" y="-185" width="32" height="370" rx="16" fill="url(#bar)" opacity="0.9"/>
    </g>
  </g>
</svg>
